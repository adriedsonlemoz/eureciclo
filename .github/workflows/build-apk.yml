name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Verify Android SDK
        run: |
          sdkmanager --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Check project version
        run: npm run check:version

      - name: Check source package hygiene
        run: |
          if git ls-files 'node_modules/**' | grep -q .; then
            echo '::error::node_modules não deve ser versionado no repositório.'
            exit 1
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web assets (Vite)
        run: npm run build

      - name: Add Android platform (if needed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Prepare Android project
        run: npm run android:prepare

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare versioned APK
        id: apk
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          APK_NAME="Eu-Reciclo-v${APP_VERSION}.apk"
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk "release/$APK_NAME"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "path=release/$APK_NAME" >> "$GITHUB_OUTPUT"

      # GitHub Actions artifacts são baixados como ZIP. Para entregar o APK
      # diretamente, publicamos o .apk como asset de uma GitHub Release.
      - name: Publish APK directly to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERSION: ${{ steps.apk.outputs.version }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        shell: bash
        run: |
          TAG="v${APK_VERSION}"
          TITLE="Eu Reciclo v${APK_VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "$TITLE" \
              --notes "APK Android gerado automaticamente para a versão ${APK_VERSION}."
          fi

      - name: Verify release APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERSION: ${{ steps.apk.outputs.version }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        shell: bash
        run: |
          TAG="v${APK_VERSION}"
          COUNT=$(gh release view "$TAG" --json assets --jq ".assets | map(select(.name == \"${APK_NAME}\")) | length")
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::A Release $TAG não contém exatamente um arquivo $APK_NAME."
            exit 1
          fi

      - name: Build summary
        run: |
          echo "## ✅ APK Build concluído!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Versão:** \`${{ steps.apk.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**APK:** \`${{ steps.apk.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "> 📥 O APK está na aba **Releases** como arquivo .apk direto (não dentro de artifact ZIP)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> Pull request validado sem publicar Release." >> "$GITHUB_STEP_SUMMARY"
          fi
